<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppDiscovery Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .controls label {
            margin-right: 10px;
            font-weight: 600;
            color: #333;
        }

        .controls select, .controls input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-right: 15px;
            font-size: 14px;
        }

        .controls button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #764ba2;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .app-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .app-developer {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .app-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .app-badge {
            padding: 5px 12px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 12px;
            color: #666;
        }

        .app-badge.category {
            background: #e3f2fd;
            color: #1976d2;
        }

        .app-signals {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .signal-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .signal-label {
            color: #999;
        }

        .signal-value {
            font-weight: 600;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            color: #667eea;
            font-size: 18px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 900px;
            margin: 0 auto;
            border-radius: 15px;
            padding: 40px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #999;
        }

        .modal-close:hover {
            color: #333;
        }

        .review-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .review-rating {
            color: #ffa000;
            font-weight: bold;
        }

        .review-body {
            color: #333;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 AppDiscovery</h1>
            <p class="subtitle">App store intelligence platform</p>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="stat-apps">-</div>
                <div class="stat-label">Total Apps</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-reviews">-</div>
                <div class="stat-label">Total Reviews</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-evidence">-</div>
                <div class="stat-label">Evidence Bundles</div>
            </div>
        </div>

        <div class="controls">
            <label>Store:</label>
            <select id="filter-store">
                <option value="">All</option>
                <option value="apple">Apple App Store</option>
                <option value="google_play">Google Play</option>
            </select>

            <label>Category:</label>
            <input type="text" id="filter-category" placeholder="e.g., Finance">

            <button onclick="loadApps()">Filter</button>
            <button onclick="refreshStats()">Refresh Stats</button>
        </div>

        <div class="app-grid" id="app-grid">
            <div class="loading">Loading apps...</div>
        </div>
    </div>

    <div class="modal" id="app-modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        async function refreshStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();

                document.getElementById('stat-apps').textContent = data.total_apps.toLocaleString();
                document.getElementById('stat-reviews').textContent = data.total_reviews.toLocaleString();
                document.getElementById('stat-evidence').textContent = data.total_evidence.toLocaleString();
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function loadApps() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = '<div class="loading">Loading apps...</div>';

            try {
                const store = document.getElementById('filter-store').value;
                const category = document.getElementById('filter-category').value;

                let url = `${API_BASE}/apps?limit=50`;
                if (store) url += `&store=${store}`;
                if (category) url += `&category=${category}`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.apps.length === 0) {
                    grid.innerHTML = '<div class="loading">No apps found</div>';
                    return;
                }

                grid.innerHTML = '';
                for (const app of data.apps) {
                    const card = createAppCard(app);
                    grid.appendChild(card);
                }
            } catch (error) {
                console.error('Failed to load apps:', error);
                grid.innerHTML = '<div class="loading">Failed to load apps. Is the API running?</div>';
            }
        }

        function createAppCard(app) {
            const card = document.createElement('div');
            card.className = 'app-card';
            card.onclick = () => showAppDetails(app.id);

            const firstSeen = new Date(app.first_seen_at).toLocaleDateString();

            card.innerHTML = `
                <div class="app-title">${app.title || 'Untitled'}</div>
                <div class="app-developer">${app.developer || 'Unknown Developer'}</div>
                <div class="app-meta">
                    ${app.category ? `<span class="app-badge category">${app.category}</span>` : ''}
                    <span class="app-badge">ID: ${app.store_app_id}</span>
                    <span class="app-badge">First seen: ${firstSeen}</span>
                </div>
            `;

            return card;
        }

        async function showAppDetails(appId) {
            const modal = document.getElementById('app-modal');
            const modalBody = document.getElementById('modal-body');

            modal.style.display = 'block';
            modalBody.innerHTML = '<div class="loading">Loading details...</div>';

            try {
                const [appResponse, reviewsResponse] = await Promise.all([
                    fetch(`${API_BASE}/apps/${appId}`),
                    fetch(`${API_BASE}/apps/${appId}/reviews?limit=10`)
                ]);

                const app = await appResponse.json();
                const reviewsData = await reviewsResponse.json();

                let signalsHTML = '';
                if (app.signals) {
                    signalsHTML = `
                        <div style="background: #f9f9f9; padding: 20px; border-radius: 10px; margin: 20px 0;">
                            <h3 style="margin-bottom: 15px; color: #667eea;">📊 Signals</h3>
                            <div class="signal-row">
                                <span class="signal-label">Reviews (7 days):</span>
                                <span class="signal-value">${app.signals.review_7d || 'N/A'}</span>
                            </div>
                            <div class="signal-row">
                                <span class="signal-label">Reviews (30 days):</span>
                                <span class="signal-value">${app.signals.review_30d || 'N/A'}</span>
                            </div>
                            <div class="signal-row">
                                <span class="signal-label">Rating Velocity (d/d):</span>
                                <span class="signal-value">${app.signals.rating_velocity_d1 || 'N/A'}</span>
                            </div>
                            <div class="signal-row">
                                <span class="signal-label">Text Density:</span>
                                <span class="signal-value">${app.signals.text_density || 'N/A'} chars</span>
                            </div>
                        </div>
                    `;
                }

                const locale = app.locales[0] || {};
                const description = locale.description || 'No description available';

                modalBody.innerHTML = `
                    <h2 style="color: #667eea; margin-bottom: 10px;">${locale.title || 'Untitled'}</h2>
                    <p style="color: #666; margin-bottom: 20px;">${app.developer || 'Unknown Developer'}</p>

                    <div style="margin-bottom: 20px;">
                        <strong>Store:</strong> ${app.store.display_name}<br>
                        <strong>App ID:</strong> ${app.store_app_id}<br>
                        <strong>Bundle ID:</strong> ${app.bundle_id || 'N/A'}<br>
                        <strong>Category:</strong> ${app.category || 'N/A'}<br>
                        <strong>Review Count:</strong> ${app.review_count}
                    </div>

                    <div style="margin-bottom: 20px;">
                        <h3 style="margin-bottom: 10px; color: #333;">Description</h3>
                        <p style="line-height: 1.6; color: #666;">${description.substring(0, 500)}${description.length > 500 ? '...' : ''}</p>
                    </div>

                    ${signalsHTML}

                    <h3 style="margin: 30px 0 15px; color: #333;">Recent Reviews</h3>
                    ${reviewsData.reviews.map(review => `
                        <div class="review-card">
                            <div class="review-header">
                                <div>
                                    <strong>${review.author || 'Anonymous'}</strong>
                                    <span class="review-rating">${'★'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}</span>
                                </div>
                                <div style="color: #999; font-size: 12px;">${new Date(review.created_at).toLocaleDateString()}</div>
                            </div>
                            ${review.title ? `<div style="font-weight: 600; margin-bottom: 8px;">${review.title}</div>` : ''}
                            <div class="review-body">${review.body || ''}</div>
                        </div>
                    `).join('')}
                `;
            } catch (error) {
                console.error('Failed to load app details:', error);
                modalBody.innerHTML = '<div class="loading">Failed to load app details</div>';
            }
        }

        function closeModal() {
            document.getElementById('app-modal').style.display = 'none';
        }

        // Close modal on background click
        window.onclick = function(event) {
            const modal = document.getElementById('app-modal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Initialize
        refreshStats();
        loadApps();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppDiscovery Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .controls-left {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .controls label {
            margin-right: 10px;
            font-weight: 600;
            color: #333;
        }

        .controls select, .controls input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .controls button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #764ba2;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
        }

        .view-toggle button {
            padding: 10px 15px;
            background: #f0f0f0;
            color: #666;
        }

        .view-toggle button.active {
            background: #667eea;
            color: white;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .app-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .app-developer {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .app-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .app-badge {
            padding: 5px 12px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 12px;
            color: #666;
        }

        .app-badge.category {
            background: #e3f2fd;
            color: #1976d2;
        }

        /* List View Styles */
        .app-list {
            display: none;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow-x: auto;
        }

        .app-list.active {
            display: block;
        }

        .app-list table {
            width: 100%;
            border-collapse: collapse;
        }

        .app-list th {
            background: #f9f9f9;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #eee;
            position: sticky;
            top: 0;
        }

        .app-list td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .app-list tr:hover {
            background: #f9f9f9;
            cursor: pointer;
        }

        .app-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
        }

        .app-icon-placeholder {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .mrr-value {
            font-weight: 600;
            color: #2e7d32;
        }

        .difficulty-badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .difficulty-easy {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .difficulty-medium {
            background: #fff3e0;
            color: #ef6c00;
        }

        .difficulty-hard {
            background: #ffebee;
            color: #c62828;
        }

        .loading {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            color: #667eea;
            font-size: 18px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 900px;
            margin: 0 auto;
            border-radius: 15px;
            padding: 40px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #999;
        }

        .modal-close:hover {
            color: #333;
        }

        .review-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .review-rating {
            color: #ffa000;
            font-weight: bold;
        }

        .review-body {
            color: #333;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 AppDiscovery</h1>
            <p class="subtitle">App store intelligence platform</p>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="stat-apps">-</div>
                <div class="stat-label">Total Apps</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-reviews">-</div>
                <div class="stat-label">Total Reviews</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-evidence">-</div>
                <div class="stat-label">Evidence Bundles</div>
            </div>
        </div>

        <div class="controls">
            <div class="controls-left">
                <label>Store:</label>
                <select id="filter-store">
                    <option value="">All</option>
                    <option value="apple">Apple App Store</option>
                    <option value="google_play">Google Play</option>
                </select>

                <label>Category:</label>
                <input type="text" id="filter-category" placeholder="e.g., Finance">

                <button onclick="loadApps()">Filter</button>
                <button onclick="refreshStats()">Refresh Stats</button>
            </div>

            <div class="view-toggle">
                <button id="grid-view-btn" class="active" onclick="switchView('grid')">Grid View</button>
                <button id="list-view-btn" onclick="switchView('list')">List View</button>
            </div>
        </div>

        <div class="app-grid" id="app-grid">
            <div class="loading">Loading apps...</div>
        </div>

        <div class="app-list" id="app-list">
            <table>
                <thead>
                    <tr>
                        <th>Icon</th>
                        <th>App Name</th>
                        <th>Developer</th>
                        <th>Language</th>
                        <th>Est. MRR</th>
                        <th>Rebuild Difficulty</th>
                        <th>Category</th>
                        <th>Reviews</th>
                    </tr>
                </thead>
                <tbody id="app-list-body">
                    <tr><td colspan="8" class="loading">Loading apps...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="app-modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let currentView = 'grid';
        let appsData = [];

        function switchView(view) {
            currentView = view;
            const gridView = document.getElementById('app-grid');
            const listView = document.getElementById('app-list');
            const gridBtn = document.getElementById('grid-view-btn');
            const listBtn = document.getElementById('list-view-btn');

            if (view === 'grid') {
                gridView.style.display = 'grid';
                listView.classList.remove('active');
                gridBtn.classList.add('active');
                listBtn.classList.remove('active');
            } else {
                gridView.style.display = 'none';
                listView.classList.add('active');
                gridBtn.classList.remove('active');
                listBtn.classList.add('active');
            }
        }

        function calculateMRR(app) {
            // Placeholder MRR calculation based on review count and category
            const baseRate = app.category === 'Finance' ? 50 : 30;
            const reviewMultiplier = (app.review_count || 0) * 0.5;
            return Math.round(baseRate + reviewMultiplier);
        }

        function calculateDifficulty(app) {
            // Placeholder difficulty based on signals
            const textDensity = app.signals?.text_density || 0;
            const reviewCount = app.review_count || 0;

            const score = (textDensity / 100) + (reviewCount / 10);

            if (score < 20) return { level: 'Easy', class: 'difficulty-easy' };
            if (score < 50) return { level: 'Medium', class: 'difficulty-medium' };
            return { level: 'Hard', class: 'difficulty-hard' };
        }

        function getLanguageName(locale) {
            if (!locale) return 'Unknown';
            const lang = locale.split('-')[0];
            const langMap = {
                'en': 'English',
                'es': 'Spanish',
                'ja': 'Japanese',
                'pt': 'Portuguese',
                'fr': 'French',
                'de': 'German',
                'zh': 'Chinese',
                'ko': 'Korean',
            };
            return langMap[lang] || lang.toUpperCase();
        }

        async function refreshStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();

                document.getElementById('stat-apps').textContent = data.total_apps.toLocaleString();
                document.getElementById('stat-reviews').textContent = data.total_reviews.toLocaleString();
                document.getElementById('stat-evidence').textContent = data.total_evidence.toLocaleString();
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function loadApps() {
            const grid = document.getElementById('app-grid');
            const listBody = document.getElementById('app-list-body');

            grid.innerHTML = '<div class="loading">Loading apps...</div>';
            listBody.innerHTML = '<tr><td colspan="8" class="loading">Loading apps...</td></tr>';

            try {
                const store = document.getElementById('filter-store').value;
                const category = document.getElementById('filter-category').value;

                let url = `${API_BASE}/apps?limit=50`;
                if (store) url += `&store=${store}`;
                if (category) url += `&category=${category}`;

                const response = await fetch(url);
                const data = await response.json();

                appsData = data.apps;

                if (data.apps.length === 0) {
                    grid.innerHTML = '<div class="loading">No apps found</div>';
                    listBody.innerHTML = '<tr><td colspan="8" class="loading">No apps found</td></tr>';
                    return;
                }

                // Render grid view
                grid.innerHTML = '';
                for (const app of data.apps) {
                    const card = createAppCard(app);
                    grid.appendChild(card);
                }

                // Render list view
                listBody.innerHTML = '';
                for (const app of data.apps) {
                    const row = createAppRow(app);
                    listBody.appendChild(row);
                }
            } catch (error) {
                console.error('Failed to load apps:', error);
                grid.innerHTML = '<div class="loading">Failed to load apps. Is the API running?</div>';
                listBody.innerHTML = '<tr><td colspan="8" class="loading">Failed to load apps</td></tr>';
            }
        }

        function createAppCard(app) {
            const card = document.createElement('div');
            card.className = 'app-card';
            card.onclick = () => showAppDetails(app.id);

            const firstSeen = new Date(app.first_seen_at).toLocaleDateString();

            card.innerHTML = `
                <div class="app-title">${app.title || 'Untitled'}</div>
                <div class="app-developer">${app.developer || 'Unknown Developer'}</div>
                <div class="app-meta">
                    ${app.category ? `<span class="app-badge category">${app.category}</span>` : ''}
                    <span class="app-badge">ID: ${app.store_app_id}</span>
                    <span class="app-badge">First seen: ${firstSeen}</span>
                </div>
            `;

            return card;
        }

        function createAppRow(app) {
            const row = document.createElement('tr');
            row.onclick = () => showAppDetails(app.id);

            const mrr = calculateMRR(app);
            const difficulty = calculateDifficulty(app);
            const language = getLanguageName(app.locale);

            const iconHtml = app.icon_url
                ? `<img src="${app.icon_url}" class="app-icon" alt="${app.title}">`
                : `<div class="app-icon-placeholder">${(app.title || 'A')[0].toUpperCase()}</div>`;

            row.innerHTML = `
                <td>${iconHtml}</td>
                <td><strong>${app.title || 'Untitled'}</strong></td>
                <td>${app.developer || 'Unknown'}</td>
                <td>${language}</td>
                <td><span class="mrr-value">$${mrr.toLocaleString()}</span></td>
                <td><span class="difficulty-badge ${difficulty.class}">${difficulty.level}</span></td>
                <td>${app.category || 'N/A'}</td>
                <td>${app.review_count || 0}</td>
            `;

            return row;
        }

        async function showAppDetails(appId) {
            const modal = document.getElementById('app-modal');
            const modalBody = document.getElementById('modal-body');

            modal.style.display = 'block';
            modalBody.innerHTML = '<div class="loading">Loading details...</div>';

            try {
                const [appResponse, reviewsResponse] = await Promise.all([
                    fetch(`${API_BASE}/apps/${appId}`),
                    fetch(`${API_BASE}/apps/${appId}/reviews?limit=10`)
                ]);

                const app = await appResponse.json();
                const reviewsData = await reviewsResponse.json();

                let signalsHTML = '';
                if (app.signals) {
                    signalsHTML = `
                        <div style="background: #f9f9f9; padding: 20px; border-radius: 10px; margin: 20px 0;">
                            <h3 style="margin-bottom: 15px; color: #667eea;">📊 Signals</h3>
                            <div class="signal-row" style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="color: #999;">Reviews (7 days):</span>
                                <span style="font-weight: 600; color: #667eea;">${app.signals.review_7d || 'N/A'}</span>
                            </div>
                            <div class="signal-row" style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="color: #999;">Reviews (30 days):</span>
                                <span style="font-weight: 600; color: #667eea;">${app.signals.review_30d || 'N/A'}</span>
                            </div>
                            <div class="signal-row" style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="color: #999;">Rating Velocity (d/d):</span>
                                <span style="font-weight: 600; color: #667eea;">${app.signals.rating_velocity_d1 || 'N/A'}</span>
                            </div>
                            <div class="signal-row" style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="color: #999;">Text Density:</span>
                                <span style="font-weight: 600; color: #667eea;">${app.signals.text_density || 'N/A'} chars</span>
                            </div>
                        </div>
                    `;
                }

                const locale = app.locales[0] || {};
                const description = locale.description || 'No description available';

                modalBody.innerHTML = `
                    <h2 style="color: #667eea; margin-bottom: 10px;">${locale.title || 'Untitled'}</h2>
                    <p style="color: #666; margin-bottom: 20px;">${app.developer || 'Unknown Developer'}</p>

                    <div style="margin-bottom: 20px;">
                        <strong>Store:</strong> ${app.store.display_name}<br>
                        <strong>App ID:</strong> ${app.store_app_id}<br>
                        <strong>Bundle ID:</strong> ${app.bundle_id || 'N/A'}<br>
                        <strong>Category:</strong> ${app.category || 'N/A'}<br>
                        <strong>Review Count:</strong> ${app.review_count}
                    </div>

                    <div style="margin-bottom: 20px;">
                        <h3 style="margin-bottom: 10px; color: #333;">Description</h3>
                        <p style="line-height: 1.6; color: #666;">${description.substring(0, 500)}${description.length > 500 ? '...' : ''}</p>
                    </div>

                    ${signalsHTML}

                    <div style="margin: 20px 0;">
                        <button onclick="getAIInsights(${appId})" id="ai-insights-btn"
                                style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;">
                            🤖 Get AI Insights
                        </button>
                    </div>

                    <div id="ai-insights-container"></div>

                    <h3 style="margin: 30px 0 15px; color: #333;">Recent Reviews</h3>
                    ${reviewsData.reviews.map(review => `
                        <div class="review-card">
                            <div class="review-header">
                                <div>
                                    <strong>${review.author || 'Anonymous'}</strong>
                                    <span class="review-rating">${'★'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}</span>
                                </div>
                                <div style="color: #999; font-size: 12px;">${new Date(review.created_at).toLocaleDateString()}</div>
                            </div>
                            ${review.title ? `<div style="font-weight: 600; margin-bottom: 8px;">${review.title}</div>` : ''}
                            <div class="review-body">${review.body || ''}</div>
                        </div>
                    `).join('')}
                `;
            } catch (error) {
                console.error('Failed to load app details:', error);
                modalBody.innerHTML = '<div class="loading">Failed to load app details</div>';
            }
        }

        function closeModal() {
            document.getElementById('app-modal').style.display = 'none';
        }

        async function getAIInsights(appId) {
            const container = document.getElementById('ai-insights-container');
            const btn = document.getElementById('ai-insights-btn');

            btn.disabled = true;
            btn.textContent = '⏳ Researching...';

            // Show progress indicator
            container.innerHTML = `
                <div style="background: white; padding: 30px; border-radius: 15px; margin: 20px 0; text-align: center;">
                    <div style="font-size: 18px; color: #667eea; margin-bottom: 20px;">
                        <span class="spinner" style="display: inline-block; animation: spin 1s linear infinite;">⏳</span>
                        Conducting comprehensive research...
                    </div>
                    <div id="progress-stages" style="color: #999; font-size: 14px; line-height: 2;">
                        <div>✓ Checking local data...</div>
                        <div style="opacity: 0.5;">⏳ Searching web...</div>
                        <div style="opacity: 0.3;">⏳ Checking app stores...</div>
                        <div style="opacity: 0.3;">⏳ Scanning social media...</div>
                        <div style="opacity: 0.3;">⏳ Deep research (if needed)...</div>
                    </div>
                    <div style="margin-top: 20px; color: #999; font-size: 12px;">This may take 30-60 seconds for accuracy</div>
                </div>
                <style>
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                </style>
            `;

            try {
                const response = await fetch(`${API_BASE}/apps/${appId}/ai-insights`);
                const data = await response.json();

                if (data.success) {
                    const insights = data.insights;

                    container.innerHTML = `
                        <div style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); padding: 25px; border-radius: 15px; margin: 20px 0;">
                            <h3 style="margin-bottom: 20px; color: #667eea; font-size: 20px;">🤖 AI-Powered Insights</h3>

                            <div style="background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px;">
                                <h4 style="color: #667eea; margin-bottom: 10px;">💰 Revenue Estimate</h4>
                                <div style="font-size: 24px; font-weight: bold; color: #27ae60; margin-bottom: 10px;">${insights.mrr_estimate}</div>
                                <p style="color: #666; line-height: 1.6;">${insights.mrr_reasoning}</p>
                            </div>

                            <div style="background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px;">
                                <h4 style="color: #667eea; margin-bottom: 10px;">🔧 Rebuild Difficulty</h4>
                                <div style="margin-bottom: 10px;">
                                    <span style="display: inline-block; padding: 8px 16px; border-radius: 20px; font-weight: bold;
                                        background: ${insights.difficulty === 'Easy' ? '#27ae60' : insights.difficulty === 'Hard' ? '#e74c3c' : '#f39c12'}; color: white;">
                                        ${insights.difficulty}
                                    </span>
                                </div>
                                <ul style="margin: 15px 0; padding-left: 20px; color: #666; line-height: 1.8;">
                                    ${insights.difficulty_factors.map(factor => `<li>${factor}</li>`).join('')}
                                </ul>
                            </div>

                            <div style="background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px;">
                                <h4 style="color: #667eea; margin-bottom: 10px;">📝 Review Summary</h4>
                                <ul style="margin: 10px 0; padding-left: 20px; color: #666; line-height: 1.8;">
                                    ${insights.review_summary.map(point => `<li>${point}</li>`).join('')}
                                </ul>
                            </div>

                            <div style="background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px;">
                                <h4 style="color: #667eea; margin-bottom: 10px;">🌍 English Equivalent Check</h4>
                                <div style="margin-bottom: 15px;">
                                    ${insights.has_en_locale ?
                                        '<span style="display: inline-block; padding: 8px 16px; border-radius: 20px; font-weight: bold; background: #e74c3c; color: white;">Has English Locale</span>' :
                                        insights.has_en_equivalent ?
                                            '<span style="display: inline-block; padding: 8px 16px; border-radius: 20px; font-weight: bold; background: #e74c3c; color: white;">English Version Exists</span>' :
                                            '<span style="display: inline-block; padding: 8px 16px; border-radius: 20px; font-weight: bold; background: #27ae60; color: white;">No English Version ✓</span>'
                                    }
                                    <span style="margin-left: 10px; color: #999;">Confidence: ${Math.round(insights.en_check_confidence * 100)}%</span>
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <strong>Research Stages:</strong> ${insights.research_stages_run ? insights.research_stages_run.join(' → ') : 'None'}
                                </div>
                                ${insights.search_results && insights.search_results.length > 0 ? `
                                    <div style="margin-top: 15px;">
                                        <strong>Evidence Sources:</strong>
                                        <ul style="margin: 10px 0; padding-left: 20px; font-size: 13px;">
                                            ${insights.search_results.slice(0, 5).map(url => `<li><a href="${url}" target="_blank" style="color: #667eea; text-decoration: none;">${url}</a></li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}
                                ${insights.research_evidence ? `
                                    <details style="margin-top: 15px;">
                                        <summary style="cursor: pointer; color: #667eea; font-weight: 600;">View Research Details</summary>
                                        <div style="margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 5px; font-size: 13px;">
                                            ${Object.entries(insights.research_evidence).map(([stage, evidence]) => `
                                                <div style="margin-bottom: 10px;">
                                                    <strong>${stage}:</strong><br>
                                                    <span style="color: #666;">${evidence.substring(0, 200)}${evidence.length > 200 ? '...' : ''}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </details>
                                ` : ''}
                            </div>

                            <div style="background: white; padding: 20px; border-radius: 10px;">
                                <h4 style="color: #667eea; margin-bottom: 10px;">📊 Market Analysis</h4>
                                <div style="margin-bottom: 10px;">
                                    <strong>Market Viability:</strong>
                                    <span style="color: ${insights.market_viability >= 7 ? '#27ae60' : insights.market_viability >= 4 ? '#f39c12' : '#e74c3c'}; font-size: 20px; font-weight: bold;">
                                        ${insights.market_viability}/10
                                    </span>
                                </div>
                                <p style="color: #666; line-height: 1.6; white-space: pre-wrap;">${insights.market_insights}</p>
                            </div>

                            <div style="text-align: center; color: #999; font-size: 13px; margin-top: 20px;">
                                Research completed in ${(insights.research_duration_ms / 1000).toFixed(1)}s
                            </div>
                        </div>
                    `;

                    btn.textContent = '✓ Insights Generated';
                    btn.style.background = '#27ae60';
                } else {
                    throw new Error('Analysis failed');
                }
            } catch (error) {
                console.error('AI insights failed:', error);
                container.innerHTML = `
                    <div style="background: #fee; padding: 20px; border-radius: 10px; margin: 20px 0; color: #c33;">
                        <strong>Failed to generate AI insights.</strong><br>
                        ${error.message || 'Please check your API keys and try again.'}
                    </div>
                `;
                btn.disabled = false;
                btn.textContent = '🤖 Get AI Insights';
            }
        }

        // Close modal on background click
        window.onclick = function(event) {
            const modal = document.getElementById('app-modal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Initialize
        refreshStats();
        loadApps();
    </script>
</body>
</html>
